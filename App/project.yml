name: Tikilive

options:
  bundleIdPrefix: com.woow.iapcore
  deploymentTarget:
    iOS: "17.6"
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # XcodeGen presets lag behind the Xcode template - pin these explicitly
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: gnu17
  configs:
    Release:
      VALIDATE_PRODUCT: YES

packages:
  TikiliveCore:
    path: ../Packages/TikiliveCore

  TikiliveUI:
    path: ../Packages/TikiliveUI

# shared by both apps
targetTemplates:
  App:
    type: application
    dependencies:
      - package: TikiliveCore
      - package: TikiliveUI
    settings:
      base:
        PRODUCT_NAME: Tikilive
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

targets:
  Tikilive-iOS:
    templates: [App]
    platform: iOS
    sources:
      - path: Tikilive-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woow.iapcore.Tikilive
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # SwiftUI lifecycle - scene and launch screen come from generated Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  Tikilive-tvOS:
    templates: [App]
    platform: tvOS
    sources:
      - path: Tikilive-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woow.iapcore.Tikilive.tvos
        TARGETED_DEVICE_FAMILY: "3"

schemes:
  Tikilive-iOS:
    build:
      targets:
        Tikilive-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  Tikilive-tvOS:
    build:
      targets:
        Tikilive-tvOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
